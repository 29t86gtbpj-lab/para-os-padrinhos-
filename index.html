<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Livro 3D - Guilherme & Flávia</title>

    <meta property="og:title" content="Guilherme & Flávia | Convite de Casamento">
<meta property="og:description" content="Você está convidado! Abra nosso convite e saiba todos os detalhes do nosso grande dia. 💍">
<meta property="og:image" content="https://29t86gtbpj-lab.github.io/para-os-padrinhos-/IMG_5017.png">
<meta property="og:url" content="https://29t86gtbpj-lab.github.io/para-os-padrinhos-/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>

body{
    margin:0;
    background:#e8dfd3;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    perspective:2000px;
    overflow:hidden;
}

#livro{
    width:350px;
    height:620px;
    position:relative;
}

.pagina{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform .8s ease;
}

.face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.face.frente img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:#e8dfd3;
}

/* verso da página: papel com relevo floral, igual à referência */
.face.verso{
    transform:rotateY(180deg);
    background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.95), transparent 55%),
        linear-gradient(135deg, #fdfcf8 0%, #f2ede1 60%, #ece4d3 100%);
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ornamento floral gravado, desenhado em SVG (relevo baixo-branco) */
.face.verso::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 350 620'>\
<defs>\
<filter id='emboss' x='-20%25' y='-20%25' width='140%25' height='140%25'>\
<feGaussianBlur in='SourceAlpha' stdDeviation='2' result='blur'/>\
<feOffset in='blur' dx='-2' dy='-2' result='off1'/>\
<feFlood flood-color='%23ffffff' flood-opacity='0.9'/>\
<feComposite in2='off1' operator='in' result='hl'/>\
<feOffset in='blur' dx='2' dy='2' result='off2'/>\
<feFlood flood-color='%23c9b98f' flood-opacity='0.45'/>\
<feComposite in2='off2' operator='in' result='sh'/>\
<feMerge><feMergeNode in='sh'/><feMergeNode in='hl'/><feMergeNode in='SourceGraphic'/></feMerge>\
</filter>\
</defs>\
<g filter='url(%23emboss)' fill='none' stroke='%23e7ddc7' stroke-width='2'>\
<path d='M40 0 C 60 60, 20 90, 60 140 C 100 180, 40 220, 90 260'/>\
<path d='M40 20 C 70 50, 30 80, 70 110'/>\
<path d='M60 40 C 40 60, 90 60, 70 90'/>\
<circle cx='60' cy='40' r='5'/>\
<circle cx='90' cy='90' r='4'/>\
<circle cx='45' cy='120' r='3'/>\
<path d='M310 620 C 290 560, 330 530, 290 480 C 250 440, 310 400, 260 360'/>\
<path d='M310 600 C 280 570, 320 540, 280 510'/>\
<path d='M290 580 C 310 560, 260 560, 280 530'/>\
<circle cx='290' cy='580' r='5'/>\
<circle cx='260' cy='530' r='4'/>\
<circle cx='305' cy='500' r='3'/>\
</g>\
</svg>");
    background-repeat:no-repeat;
    background-size:100% 100%;
    opacity:.9;
}

.face.verso .selo{
    position:relative;
    width:64px;
    height:64px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%, #f3d98a, #c9a24b 45%, #8a6a24 100%);
    box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Times New Roman', serif;
    font-style:italic;
    font-weight:700;
    color:#4a3308;
    font-size:1.1rem;
    letter-spacing:1px;
}

/* sombra sutil simulando o papel curvando durante a virada */
.pagina::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:12px;
    background:linear-gradient(90deg, rgba(0,0,0,.3), transparent 45%);
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
    z-index:2;
}

.virando{
    transform:rotateY(-180deg);
}

.virando::after{
    opacity:1;
}

</style>
</head>

<body>

<div id="livro"></div>

<script>

const paginas = [
"IMG_5017.png",
"IMG_5216.png",
"IMG_5236.png",
"IMG_5237.png",
"IMG_4261.png",
"IMG_5287.png"
];


let atual = 0;

// links das páginas especiais (número da página começando em 1)
// no momento nenhuma página tem link; ex.: 5: "https://guilhermeeflavia.me/"
const linksPagina = {
};

const livro = document.getElementById("livro");

// monta todas as páginas empilhadas, cada uma com frente (foto) e verso (papel com relevo)
paginas.forEach((src, i) => {
    const div = document.createElement("div");
    div.className = "pagina";
    div.style.zIndex = paginas.length - i;
    div.innerHTML = `
        <div class="face frente"><img src="${src}"></div>
        <div class="face verso"><div class="selo">G&F</div></div>
    `;
    livro.appendChild(div);
});

function proxima(){

    if(atual >= paginas.length - 1) return;

    const pagina = livro.children[atual];

    pagina.classList.add("virando");

    atual++;
}

function anterior(){

    if(atual <= 0) return;

    atual--;

    const pagina = livro.children[atual];

    pagina.classList.remove("virando");
}

let touchStartX = 0;

document.addEventListener("touchstart",(e)=>{
    touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend",(e)=>{

    const fim = e.changedTouches[0].screenX;

    if(touchStartX - fim > 50){
        proxima();
    }

    if(fim - touchStartX > 50){
        anterior();
    }

});

// botões "Abrir localização" que fazem parte da imagem: áreas clicáveis invisíveis
// posições em fração da imagem (x1, x2 = esquerda/direita; y1, y2 = topo/base)
const botoesLocalizacao = {
    3: {
        url: "https://maps.app.goo.gl/267LG3owEGgr6xJq9?g_st=ic",
        x1: 0.33, x2: 0.70, y1: 0.87, y2: 0.94
    },
    4: {
        url: "https://maps.app.goo.gl/K3RfUVqnDqG6cGDU7?g_st=ic",
        x1: 0.33, x2: 0.67, y1: 0.745, y2: 0.805
    }
};

function cliqueNoBotaoLocalizacao(e){

    const botao = botoesLocalizacao[atual + 1];
    if(!botao) return false;

    const img = livro.children[atual].querySelector(".frente img");
    if(!img || !img.naturalWidth) return false;

    // área realmente ocupada pela imagem (object-fit: contain)
    const r = img.getBoundingClientRect();
    const escala = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
    const w = img.naturalWidth * escala;
    const h = img.naturalHeight * escala;
    const x0 = r.left + (r.width - w) / 2;
    const y0 = r.top + (r.height - h) / 2;

    const fx = (e.clientX - x0) / w;
    const fy = (e.clientY - y0) / h;

    if(fx >= botao.x1 && fx <= botao.x2 && fy >= botao.y1 && fy <= botao.y2){
        window.open(botao.url, "_blank");
        return true;
    }

    return false;
}

document.addEventListener("click",(e)=>{

    // botão "Abrir localização" nas páginas 3 e 4
    if(cliqueNoBotaoLocalizacao(e)) return;

    // páginas com link (presentes / confirmar presença): clique abre o link
    const numeroPaginaAtual = atual + 1;
    if(linksPagina[numeroPaginaAtual]){
        window.open(linksPagina[numeroPaginaAtual], "_blank");
        return;
    }

    // na capa (primeira página), qualquer clique abre o convite
    if(atual === 0){
        proxima();
        return;
    }

    if(e.clientX > window.innerWidth/2){
        proxima();
    }else{
        anterior();
    }

});

</script>

</body>
</html>
